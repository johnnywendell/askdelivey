{% extends 'base.html' %}
{% load static %}

{% block title %}Pedidos{% endblock %}
{% block page_title %}Pedidos em Tempo Real{% endblock %}

{% block extra_css %}
<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
    #map {
        height: 75vh;
        border-radius: 16px;
        overflow: hidden;
    }

    .leaflet-container {
        border-radius: 16px;
    }

    #orders-list {
        max-height: 75vh;
        overflow-y: auto;
    }

    .order-item {
        cursor: pointer;
        transition: 0.2s;
    }

    .order-item:hover {
        background: #f5f5f5;
    }
</style>
{% endblock %}

{% block content %}
<div class="row">

    <!-- LISTA DE PEDIDOS -->
    <div class="col-md-3">
        <div class="card shadow-sm h-100">

            <div class="card-header">
                <strong>Pedidos</strong>
            </div>

            <div class="card-body p-0">

                <ul id="orders-list" class="list-group list-group-flush">

                    <li class="list-group-item text-muted">
                        Carregando...
                    </li>

                </ul>

            </div>

        </div>
    </div>

    <!-- MAPA -->
    <div class="col-md-9">
        <div class="card shadow-sm">

            <div class="card-body">
                <div id="map"></div>
            </div>

        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    let routeLayer = null;
    let driverMarker = null;
    let map = L.map('map', {
        zoomControl: false
    }).setView([-8.05, -34.9], 12);

    L.control.zoom({
        position: 'bottomright'
    }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap & CartoDB'
    }).addTo(map);

    let orderMarkers = {};
    let hasCentered = false;

    const blueIcon = L.icon({
        iconUrl: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png',
        iconSize: [32, 32],
        iconAnchor: [16, 32]
    });

    const greenIcon = L.icon({
        iconUrl: 'https://maps.google.com/mapfiles/ms/icons/green-dot.png',
        iconSize: [32, 32],
        iconAnchor: [16, 32]
    });

    const redIcon = L.icon({
        iconUrl: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png',
        iconSize: [32, 32],
        iconAnchor: [16, 32]
    });
    async function fetchOrders() {

        const response = await fetch('/orders/orders');
        const orders = await response.json();
        window.ordersData = orders;
        
        let html = '';
        let bounds = [];

        if (orders.length === 0) {
            html = `
                <li class="list-group-item text-muted">
                    Nenhum pedido encontrado
                </li>
            `;
        }

        orders.forEach(order => {

            if (!order.restaurante_latitude || !order.restaurante_longitude) return;

            const lat = parseFloat(order.restaurante_latitude);
            const lng = parseFloat(order.restaurante_longitude);

            bounds.push([lat, lng]);

            // 🎨 STATUS VISUAL
            const statusLabel =
                order.status === 'delivered' ? 'Entregue' :
                order.status === 'in_transit' ? 'Em rota' :
                order.status === 'accepted' ? 'Aceito' :
                order.status === 'approved' ? 'Aprovado' :
                order.status === 'created' ? 'Criado' :
                order.status === 'canceled' ? 'Cancelado' :
                'Desconhecido';

            const statusColor =
                order.status === 'delivered' ? '🟢' :
                order.status === 'in_transit' ? '🔵' :
                order.status === 'canceled' ? '🔴' :
                order.status === 'approved' ? '🟣' :
                '🟡';

            html += `
                <li class="list-group-item order-item">

                    <div onclick="focusOrder(${order.id})">

                        <strong>#${order.id}</strong><br>

                        ${order.customer_name}<br>

                        Local: ${order.restaurante_nome}<br>

                        <small>
                            ${statusColor} ${statusLabel}
                        </small>

                        ${
                            !order.entregador &&
                            (
                                order.status === 'approved' ||
                                order.status === 'created'
                            )
                            ?
                            `
                            <div class="mt-2">
                                <button
                                    class="btn btn-sm btn-success w-100"
                                    onclick="acceptOrder(event, ${order.id})">

                                    Aceitar Pedido
                                </button>
                            </div>
                            `
                            :
                            `
                            <div class="mt-2">
                                <small class="text-muted">
                                    ${
                                        order.entregador_nome
                                        ? 'Entregador: ' + order.entregador_nome
                                        : ''
                                    }
                                </small>
                            </div>
                            `
                        }

                    </div>

                </li>
            `;

            let icon =
                order.status === 'delivered' ? greenIcon :
                order.status === 'canceled' ? redIcon :
                blueIcon;

            if (orderMarkers[order.id]) {

                orderMarkers[order.id].setLatLng([lat, lng]);
                orderMarkers[order.id].setIcon(icon);

            } else {

                orderMarkers[order.id] = L.marker([lat, lng], {
                    icon: icon
                })
                .addTo(map)
                .bindPopup(`
                    <strong>Pedido #${order.id}</strong><br>
                    Cliente: ${order.customer_name}<br>
                    Status: ${statusLabel}
                `);
            }
        });

        document.getElementById('orders-list').innerHTML = html;

        if (bounds.length > 0 && !hasCentered) {
            map.fitBounds(bounds, { padding: [50, 50] });
            hasCentered = true;
        }
    }
    function focusOrder(id) {

            const order =
                window.ordersData.find(
                    o => o.id === id
                );

            if (!order) return;

            const lat =
                parseFloat(order.restaurante_latitude);

            const lng =
                parseFloat(order.restaurante_longitude);

            map.setView([lat, lng], 15);

            if (orderMarkers[id]) {
                orderMarkers[id].openPopup();
            }

            drawRoute(order);
        }
    async function drawRoute(order) {

        // remove rota antiga
        if (routeLayer) {
            map.removeLayer(routeLayer);
        }

        // remove marker entregador antigo
        if (driverMarker) {
            map.removeLayer(driverMarker);
        }

        /*
        ===================================
        COORDENADAS
        ===================================
        */

        const restaurantLat =
            parseFloat(order.restaurante_latitude);

        const restaurantLng =
            parseFloat(order.restaurante_longitude);

        const customerLat =
            parseFloat(order.latitude);

        const customerLng =
            parseFloat(order.longitude);

        /*
        ===================================
        PONTOS DA ROTA
        ===================================
        */

        let coordinates = [];

        /*
        ===================================
        ENTREGADOR
        ===================================
        */

        if (
            order.entregador_latitude &&
            order.entregador_longitude
        ) {

            const driverLat =
                parseFloat(order.entregador_latitude);

            const driverLng =
                parseFloat(order.entregador_longitude);

            coordinates.push(
                `${driverLng},${driverLat}`
            );

            // marker entregador
            driverMarker = L.marker(
                [driverLat, driverLng]
            )
            .addTo(map)
            .bindPopup('Entregador');
        }

        /*
        ===================================
        RESTAURANTE
        ===================================
        */

        coordinates.push(
            `${restaurantLng},${restaurantLat}`
        );

        /*
        ===================================
        CLIENTE
        ===================================
        */

        coordinates.push(
            `${customerLng},${customerLat}`
        );

        /*
        ===================================
        URL OSRM
        ===================================
        */

        const url =
            `https://router.project-osrm.org/route/v1/driving/${coordinates.join(';')}?overview=full&geometries=geojson`;

        try {

            const response = await fetch(url);

            const data = await response.json();

            if (!data.routes || !data.routes.length) {
                return;
            }

            const route =
                data.routes[0].geometry;

            /*
            ===================================
            DESENHA ROTA
            ===================================
            */

            routeLayer = L.geoJSON(route, {

                style: {
                    color: '#2563eb',
                    weight: 5,
                    opacity: 0.8
                }

            }).addTo(map);

            /*
            ===================================
            AJUSTA MAPA
            ===================================
            */

            map.fitBounds(
                routeLayer.getBounds(),
                {
                    padding: [50, 50]
                }
            );

            /*
            ===================================
            DISTÂNCIA / TEMPO
            ===================================
            */

            const distanceKm =
                (data.routes[0].distance / 1000)
                .toFixed(1);

            const durationMin =
                Math.ceil(
                    data.routes[0].duration / 60
                );

            console.log(
                `Distância: ${distanceKm} km`
            );

            console.log(
                `Tempo: ${durationMin} min`
            );

        } catch (e) {

            console.error(e);
        }
    }
fetchOrders();
        async function acceptOrder(event, orderId) {

            event.stopPropagation();

            const confirmar = confirm(
                'Deseja aceitar este pedido?'
            );

            if (!confirmar) return;

            try {

                const response = await fetch(
                    `/orders/${orderId}/accept/`,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        }
                    }
                );

                const data = await response.json();

                if (data.success) {

                    alert('Pedido aceito com sucesso');

                    fetchOrders();

                } else {

                    alert(data.message);
                }

            } catch (e) {

                alert('Erro ao aceitar pedido');
            }
        }
</script>
{% endblock %}
